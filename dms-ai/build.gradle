plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.serialization)
}

// Adapter: OpenAI-compatible LLM client and document reading (PDFBox, Apache POI).
dependencies {
    implementation project(":dms-application")
    // The engine is part of AiAdapters' constructor, so tests of the app can pass a mock one.
    api libs.ktor.client.core
    implementation libs.bundles.ktor.client
    implementation libs.kotlinx.serialization.json
    implementation libs.pdfbox
    implementation libs.poi.ooxml
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.ktor.client.mock
}

// The test against a running LM Studio runs only on request: ./gradlew :dms-ai:test -Pai.integration=true
// (optional: -Pai.baseUrl=http://localhost:1234/v1 -Pai.model=<model id>).
tasks.named("test") {
    ["ai.integration", "ai.baseUrl", "ai.model"].each { name ->
        if (project.hasProperty(name)) {
            systemProperty name, project.property(name)
        }
    }
}
