# Tests, lints and formatting for Rust and the UI. Runs on pushes and pull requests, and gates every release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # rustup is preinstalled on GitHub's runners; no third-party action needed.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix ui

      # The Tauri crate embeds ui/dist at compile time, so the UI is built first.
      - name: UI type check, tests and build
        run: |
          npm test --prefix ui
          npm run build --prefix ui

      # dms-infra-pdf binds the PDFium library at runtime; its tests need the Linux copy.
      - name: PDFium
        run: scripts/fetch-pdfium.sh linux-x64

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
